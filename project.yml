name: LamAICRM
options:
  bundleIdPrefix: com.tqlam39
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '1.0.0'
targets:
  LamAICRM:
    type: application
    platform: iOS
    sources: [App, Core, Data, Features, Services, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tqlam39.lamaicrm.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LẮM AI CRM
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Chụp ảnh bất động sản hoặc đọc thông tin tin đăng.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Nhập thông tin bằng giọng nói khi bạn bấm micro.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Chuyển lời nói tiếng Việt thành nội dung nhập liệu.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - sdk: libsqlite3.tbd
  LamAICRMTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: LamAICRM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LamAICRMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LamAICRM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LamAICRM:
    build:
      targets:
        LamAICRM: all
    test:
      targets: [LamAICRMTests, LamAICRMUITests]
